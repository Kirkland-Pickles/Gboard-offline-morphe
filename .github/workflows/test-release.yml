name: Test prerelease

on:
  push:
    branches: [test]

permissions:
  contents: read

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and validate bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew buildAndroid :patches:generatePatchesList --no-daemon
          test -f patches/build/libs/patches-0.1.3-dev.1.mpp
          jq -e '[.patches[].name] | (index("Remove network access") != null) and (index("Offline system voice typing") != null) and (index("Block App Hijacking") != null)' patches-list.json > /dev/null
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.1.3-dev.1 patches/build/libs/patches-0.1.3-dev.1.mpp --target "$GITHUB_SHA" --prerelease --latest=false --title "offline-gboard 0.1.3-dev.1" --notes "Test release: adds Block App Hijacking, adapted from kveld9." --repo "$GITHUB_REPOSITORY"
      - name: Publish prerelease metadata
        run: |
          git checkout -b dev
          jq --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/v0.1.3-dev.1/patches-0.1.3-dev.1.mpp" --arg created "$(date -u '+%Y-%m-%dT%H:%M:%S')" '.version = "0.1.3-dev.1" | .download_url = $url | .created_at = $created' patches-bundle.json > "$RUNNER_TEMP/patches-bundle.json"
          mv "$RUNNER_TEMP/patches-bundle.json" patches-bundle.json
          git add patches-bundle.json patches-list.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish prerelease metadata"
          git push origin dev
